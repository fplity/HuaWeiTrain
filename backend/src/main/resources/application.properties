server.address=${ECHO_BIND:127.0.0.1}
server.port=${ECHO_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${ECHO_KEYSTORE:file:.local/echo-local.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ECHO_KEYSTORE_PASSWORD}
server.tomcat.connection-timeout=8s
server.error.include-message=never

echo.catalog-directory=${ECHO_CATALOG:../features/home/src/main/resources/rawfile}
echo.listener-password=${ECHO_LISTENER_PASSWORD}
echo.operator-password=${ECHO_OPERATOR_PASSWORD}